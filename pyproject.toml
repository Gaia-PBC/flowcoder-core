[project]
name = "flowcoder"
version = "1.0.0"
description = "Flowchart execution engine for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flowcoder-engine>=0.1.0",
    "flowcoder-flowchart>=0.1.0",
]

# The repo root ships no source of its own — it is a workspace shell that
# pins the two packages and hosts the cross-package tests in tests/.
[tool.uv]
package = false

[tool.uv.sources]
flowcoder-engine = { path = "packages/flowcoder-engine", editable = true }
flowcoder-flowchart = { path = "packages/flowcoder-flowchart", editable = true }

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
asyncio_mode = "auto"
markers = [
    "slow: marks tests that use real claude CLI (costs tokens, deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E203"]
